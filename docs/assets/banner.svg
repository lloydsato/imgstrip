<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">imgstrip</title>
  <desc id="d">Identifying tags such as GPS, EXIF, XMP and thumbnail peel away from a photograph, leaving a clean, verified picture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1c19"/>
      <stop offset="1" stop-color="#17372f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d5aa8"/>
      <stop offset="0.55" stop-color="#d9798a"/>
      <stop offset="1" stop-color="#f6b07a"/>
    </linearGradient>
    <clipPath id="photo"><rect x="900" y="70" width="200" height="160" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="62" y="152" font-size="86" font-weight="700" letter-spacing="-3" fill="#f2faf6">imgstrip</text>
    <text x="66" y="200" font-size="23" fill="#a8d0c4">Share the picture. Keep everything else to yourself.</text>
    <text x="66" y="236" font-size="16" fill="#6f9a8e" letter-spacing="0.3">Rebuilds every image from its pixels, then checks its own work.</text>
  </g>

  <!-- tags peeling away -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <g opacity="1">
      <path d="M826 88 H900" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="726" y="74" width="100" height="28" rx="14" fill="#ff8f7a" fill-opacity="0.16" stroke="#ff9d8a"/>
      <text x="776" y="93" fill="#ffb9ab">GPS</text>
    </g>
    <g opacity="0.8">
      <path d="M806 128 H900" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="696" y="114" width="110" height="28" rx="14" fill="#ff8f7a" fill-opacity="0.16" stroke="#ff9d8a"/>
      <text x="751" y="133" fill="#ffb9ab">EXIF</text>
    </g>
    <g opacity="0.6">
      <path d="M826 168 H900" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="716" y="154" width="110" height="28" rx="14" fill="#ff8f7a" fill-opacity="0.16" stroke="#ff9d8a"/>
      <text x="771" y="173" fill="#ffb9ab">XMP</text>
    </g>
    <g opacity="0.4">
      <path d="M796 208 H900" stroke="#ff9d8a" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="656" y="194" width="140" height="28" rx="14" fill="#ff8f7a" fill-opacity="0.16" stroke="#ff9d8a"/>
      <text x="726" y="213" fill="#ffb9ab">thumbnail</text>
    </g>
  </g>

  <!-- the picture -->
  <g clip-path="url(#photo)">
    <rect x="900" y="70" width="200" height="160" fill="url(#sky)"/>
    <circle cx="1010" cy="148" r="22" fill="#fff4d6" fill-opacity="0.95"/>
    <path d="M900 230 V186 L945 150 L982 178 L1030 128 L1100 188 V230 Z" fill="#2c2a4d"/>
    <path d="M900 230 V206 L952 178 L996 204 L1048 168 L1100 206 V230 Z" fill="#171933"/>
  </g>
  <rect x="900" y="70" width="200" height="160" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- verified -->
  <circle cx="1100" cy="226" r="30" fill="#0d1c19"/>
  <circle cx="1100" cy="226" r="25" fill="#2fbf8f"/>
  <path d="M1088 227 L1096 235 L1112 217" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
