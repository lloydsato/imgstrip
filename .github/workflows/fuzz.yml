name: Fuzz

# Coverage-guided fuzzing with Atheris (see fuzz/run.py). Every target in fuzz/targets.py runs for a
# minute on each push and pull request and for half an hour each night. The second job fuzzes Pillow's decoders
# through a Pillow built with AddressSanitizer and UndefinedBehaviorSanitizer, so that memory errors in the C code
# are reported; it is slow to build, so it runs at night and on request only.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [inspect, jpeg_rebuild, dct_round_trip, icc_sanitise, jumbf_store, sandbox_answer, decode, strip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e . atheris
      - run: python fuzz/run.py --seeds corpus
      - name: Fuzz (one minute; half an hour at night)
        run: >
          python fuzz/run.py ${{ matrix.target }} corpus/${{ matrix.target }}
          -max_total_time=${{ github.event_name == 'schedule' && 1800 || 60 }} -rss_limit_mb=4096
      - name: Keep the input that made it fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-${{ matrix.target }}
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
          if-no-files-found: ignore

  sanitizers:
    # Pillow and Atheris are built from source with clang, so this takes a few minutes before the fuzzing starts.
    # UndefinedBehaviorSanitizer only reports (Pillow's own _webp.c shifts into the sign bit, which is noisy but
    # harmless); AddressSanitizer stops the run on a memory error, and the input is kept.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build tools and the libraries Pillow wraps
        run: >
          sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev
          libjpeg-dev libwebp-dev libtiff-dev zlib1g-dev libfreetype-dev
      - name: Install imgstrip and write the seed corpus (with the ordinary Pillow, which can write every format)
        run: |
          pip install -e .
          pip install --no-binary atheris --no-deps atheris
          python fuzz/run.py --seeds corpus
        env:
          CLANG_BIN: /usr/bin/clang
      - name: Rebuild Pillow with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          pip install --force-reinstall --no-deps --no-binary Pillow --no-cache-dir
          "Pillow==$(python -c 'import PIL; print(PIL.__version__)')"
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=address,undefined
      - name: Fuzz the decoders (half an hour)
        run: |
          export LD_PRELOAD="$(python -c 'import atheris, os; print(os.path.join(os.path.dirname(atheris.__file__), "..", "asan_with_fuzzer.so"))')"
          python fuzz/run.py decode corpus/decode -max_total_time=1800 -rss_limit_mb=4096
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
      - name: Keep the input that made it fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-sanitizers
          path: |
            crash-*
            leak-*
            oom-*
            timeout-*
          if-no-files-found: ignore
