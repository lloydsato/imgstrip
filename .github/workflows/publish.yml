name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyPI never accepts a version twice (not even one that was deleted), so the
      # release tag must name the version being built.
      - name: Check tag matches package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/imgstrip/__init__.py)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      # The README is the package's PyPI page and is generated from __version__; render it here too so a release
      # never ships a stale one, even if the README workflow has not caught up with the tag yet.
      - name: Render README from its template
        run: python scripts/render_readme.py
      - run: pip install build==1.6.1 && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned to a commit (the v1.14.3 release), not to the moving release/v1 branch: this step holds the right to
      # publish the package.  Move it by hand to a newer release when you want one.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          attestations: true
