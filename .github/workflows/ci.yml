name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The independent readers (exiftool, ImageMagick, FFmpeg) make the differential tests run instead of skip.
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl imagemagick ffmpeg
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: imgstrip --self-test
