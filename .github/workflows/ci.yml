name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  readme:
    # README.md is generated from docs/README.template.md. Fail a pull request that bumps the version (or edits
    # the template) without refreshing it. On main the "README" workflow refreshes it, so this runs for pull
    # requests only (and is skipped when the publish workflow calls this one).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/render_readme.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # The independent readers (exiftool, ImageMagick, FFmpeg) make the differential tests run instead of skip.
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl imagemagick ffmpeg
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: imgstrip --self-test

  minimum-versions:
    # pyproject.toml promises "numpy>=1.26", "Pillow>=13.0.0" and "pillow-heif>=0.18"; the other jobs install the
    # newest of each, so this one installs those exact floors on the oldest supported Python and runs everything.
    # When a floor in pyproject.toml changes, change the pins below with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl imagemagick ffmpeg
      - run: pip install -e '.[test]'
      - run: pip install "numpy==1.26.4" "Pillow==13.0.0" "pillow-heif==0.18.0"
      - run: python -m pytest -q
      - run: imgstrip --self-test
